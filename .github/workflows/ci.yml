name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `npm install` rather than `npm ci`: no package-lock.json exists yet
      # (this repo was scaffolded without Node installed — see docs/07-roadmap.md).
      # Switch to `npm ci` + enable dependency caching once a lockfile is committed.
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prisma:generate
      - run: npm test

  mobile:
    name: Mobile (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
